<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Edit Student</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-glow: #00f6ff;
            --background-color: #010409;
            --card-bg: rgba(10, 25, 47, 0.7);
            --border-color: rgba(0, 246, 255, 0.2);
            --text-color: #e6edf3;
            --secondary-text: rgba(230, 237, 243, 0.7);
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            flex-shrink: 0;
            background: rgba(5, 15, 30, 0.6);
            backdrop-filter: blur(15px);
            border-right: 1px solid var(--border-color);
            padding: 30px;
            display: flex;
            flex-direction: column;
            z-index: 2;
        }
        .sidebar-header h2 { font-family: 'Orbitron', sans-serif; margin: 0 0 40px 0; font-size: 1.8rem; color: var(--primary-glow); text-shadow: 0 0 10px var(--primary-glow); text-align: center;}
        
        .nav-menu a { display: flex; align-items: center; padding: 15px; color: var(--secondary-text); text-decoration: none; border-radius: 8px; margin-bottom: 10px; transition: all 0.3s ease; border: 1px solid transparent; font-weight: 600; }
        .nav-menu a.active, .nav-menu a:hover { background-color: rgba(0, 246, 255, 0.1); color: #fff; border-color: var(--border-color); }
        .nav-menu a svg { margin-right: 15px; width: 24px; height: 24px; }

        .main-content { flex-grow: 1; padding: 40px 50px; overflow-y: auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .header h1 { font-family: 'Orbitron', sans-serif; margin: 0; font-size: 2.8rem; color: #fff; }
        
        .content-card { background: var(--card-bg); backdrop-filter: blur(10px); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); }
        .content-card h2 { font-family: 'Orbitron', sans-serif; font-weight: 500; color: var(--primary-glow); border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: var(--secondary-text); }
        .form-group input, .form-group select {
            padding: 10px 15px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color);
            border-radius: 8px; font-size: 1rem; color: var(--text-color);
        }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary-glow); box-shadow: 0 0 10px rgba(0, 246, 255, 0.3); }

        .btn { padding: 12px 25px; background: var(--primary-glow); color: var(--background-color); border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 700; transition: all 0.3s ease; }
        .btn:hover { box-shadow: 0 0 15px var(--primary-glow); }
        .back-link { color: var(--secondary-text); text-decoration: none; margin-left: 20px; }
        .back-link:hover { color: var(--primary-glow); }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Admin Console</h2>
        </div>
        <nav class="nav-menu">
            <a href="{{ url_for('admin_dashboard') }}">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 01-6.23-.693L4.2 15.3m15.6 0-1.57.393m0 0l-1.57.393m0 0l-1.57.393m0 0l-1.57.393M4.2 15.3l1.57.393m0 0l1.57.393m0 0l1.57.393m0 0l1.57.393m0 0l1.57.393M12 21v-3.5M4.2 15.3l-1.57-.393M19.8 15.3l1.57-.393" /></svg>
                <span>Dashboard</span>
            </a>
            <a href="{{ url_for('admin_manage_students') }}" class="active">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-4.67c.12-.318.232-.656.328-1.014a.75.75 0 011.498-.07c.096.358.208.71.328 1.014.453 1.196.992 2.303 1.634 3.336" /></svg>
                <span>Students</span>
            </a>
            <a href="{{ url_for('admin_manage_subjects') }}">
                 <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" /></svg>
                <span>Subjects</span>
            </a>
             <a href="{{ url_for('admin_results') }}">
                <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6a7.5 7.5 0 100 15 7.5 7.5 0 000-15zM21 21l-5.197-5.197" /></svg>
                <span>Results</span>
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="header">
            <h1>Edit Student</h1>
        </div>
        
        <div class="content-card">
            <form action="{{ url_for('admin_edit_student', student_id=student.id) }}" method="POST">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" value="{{ student.name }}" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" value="{{ student.email }}" required>
                    </div>
                    <div class="form-group">
                        <label for="roll_no">Roll Number</label>
                        <input type="text" id="roll_no" name="roll_no" value="{{ student.roll_no }}" required>
                    </div>
                    <div class="form-group">
                        <label for="password">New Password</label>
                        <input type="password" id="password" name="password" placeholder="Leave blank to keep current password">
                    </div>
                    <div class="form-group">
                        <label for="branch_code">Branch</label>
                        <select id="branch_code" name="branch_code" required>
                            {% for code, name in branches.items() %}
                            <option value="{{ code }}" {% if student.branch_code == code %}selected{% endif %}>{{ name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="year">Year</label>
                        <select id="year" name="year" required>
                            {% for y in [1, 2, 3, 4] %}
                            <option value="{{ y }}" {% if student.year == y %}selected{% endif %}>{{ y }} Year</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div style="margin-top: 20px;">
                    <button type="submit" class="btn">Update Student</button>
                    <a href="{{ url_for('admin_manage_students') }}" class="back-link">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
