<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHITM Orbital OS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">


    <style>
        /* --- Root Variables & Theme (Deep Space / Cyberpunk) --- */
        :root {
            --primary-glow: #00e6ff; /* Cyan */
            --secondary-glow: #ff00ea; /* Magenta */
            --tertiary-glow: #6a00ff; /* Violet */
            --error-glow: #ff4d4d; /* Red for errors */
            --background-dark: #02011a; /* Very Dark Blue-Purple */
            --card-bg-light: rgba(255, 255, 255, 0.05); /* Lightest glass effect */
            --card-bg-dark: rgba(0, 0, 0, 0.3); /* Darker interior glass */
            --border-color-light: rgba(0, 230, 255, 0.2); /* Light cyan border */
            --border-color-dark: rgba(255, 0, 234, 0.1); /* Magenta border */
            --text-color: #e0f7fa; /* Light aqua */
            --secondary-text: rgba(224, 247, 250, 0.7);
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Poppins', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
        }

        /* --- Global & Body Setup --- */
        body, html {
            height: 100%;
            margin: 0;
            font-family: var(--font-body);
            color: var(--text-color);
            overflow: hidden;
            background-color: var(--background-dark);
            perspective: 1500px; /* Deeper 3D perspective */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="%2300e6ff" viewBox="0 0 16 16"><path d="M14.082 2.182a.5.5 0 01.103.557l-1.026 3.636c-.086.305-.342.536-.677.536h-1.884l-.478-2.677-.923.615c.307.387.525.86.634 1.383L7.9 10.354 5.343 9.432l.468-1.574-.923.615-.478-2.677-1.884.536c-.335 0-.591-.231-.677-.536L.415 2.739a.5.5 0 01.103-.557l13.565-1.9a.5.5 0 01.455.035zM7.214 7.689l2.768 4.931-1.282.854-2.768-4.931 1.282-.854z"/></svg>') 0 0, auto;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- Global Scanline Overlay --- */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000; /* On top of everything */
            background: repeating-linear-gradient(
                to bottom,
                transparent 0%,
                rgba(0, 0, 0, 0.1) 1px,
                transparent 2px
            );
            opacity: 0.2;
            animation: scanlineFade 1s linear infinite alternate;
        }

        @keyframes scanlineFade {
            0% { opacity: 0.15; }
            100% { opacity: 0.25; }
        }

        /* --- "Cosmic Dust" Animated Background --- */
        #wallpaper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: var(--background-dark);
            overflow: hidden;
        }
        #wallpaper::before {
            content: '';
            position: absolute;
            width: 300vw;
            height: 300vh;
            background:
                radial-gradient(circle at 10% 20%, var(--primary-glow) 0%, transparent 20%),
                radial-gradient(circle at 70% 80%, var(--secondary-glow) 0%, transparent 20%),
                radial-gradient(circle at 30% 60%, var(--tertiary-glow) 0%, transparent 20%);
            filter: blur(80px);
            opacity: 0.1;
            animation: cosmic-drift 60s linear infinite alternate;
        }
        #wallpaper::after { /* Smaller, faster moving particles */
            content: '';
            position: absolute;
            width: 100vw;
            height: 100vh;
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 50px 50px;
            opacity: 0.05;
            animation: star-drift 120s linear infinite;
        }

        @keyframes cosmic-drift {
            0%   { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-40%, -40%) rotate(360deg); }
        }
        @keyframes star-drift {
            0%   { background-position: 0 0; }
            100% { background-position: 100% 100%; }
        }


        /* --- Frosted Glass Dock --- */
        #dock-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateZ(0); /* Ensure 3D context */
            z-index: 10;
            
            background: var(--card-bg-light);
            backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--border-color-light);
            border-radius: 25px;
            padding: 10px 15px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
            
            display: flex;
            gap: 15px;
            
            transform-style: preserve-3d; /* For icon parallax */
            transition: transform 0.1s linear;
        }

        /* --- Desktop Icons in Dock --- */
        .dock-icon {
            width: 60px;
            height: 60px;
            background: var(--card-bg-dark);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-family: var(--font-body);
            font-weight: 300;
            cursor: pointer;
            position: relative;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Bounce transition */
            transform: translateZ(10px); /* Lifts icon off the dock */
            overflow: hidden; /* For hidden text */
        }
        
        .dock-icon:hover {
            transform: translateZ(30px) scale(1.15); /* Pop out and grow */
            border-color: var(--primary-glow);
            box-shadow: 0 0 25px rgba(0, 230, 255, 0.4);
            color: var(--primary-glow);
        }
        
        .dock-icon svg {
            width: 28px;
            height: 28px;
            stroke-width: 1.5;
            margin-bottom: 3px;
            transition: color 0.2s ease;
        }

        .dock-icon span { /* Hidden label that appears on hover */
            position: absolute;
            bottom: -20px; /* Initially hidden */
            opacity: 0;
            transition: all 0.2s ease-out;
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 0.5px;
            text-shadow: 0 0 5px rgba(0, 230, 255, 0.3);
        }

        .dock-icon:hover span {
            bottom: 5px; /* Move up on hover */
            opacity: 1;
        }
        
        /* Specific icon colors */
        .dock-icon#login-icon svg { color: var(--primary-glow); }
        .dock-icon#status-icon svg { color: #00FF7F; } /* Green */
        .dock-icon#help-icon svg { color: #FFD700; } /* Gold */
        .dock-icon#shutdown-icon svg { color: #FF4D4D; } /* Red */


        /* --- Login Modal (Hidden by default) --- */
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); /* Dim the background */
            backdrop-filter: blur(8px);
            z-index: 98;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        
        #modal-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        /* 3D container for glitch/scale effect */
        .login-container {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 99;
            width: 90%;
            max-width: 480px; /* Slightly larger for presence */
            transform-style: preserve-3d;
            transform: translate(-50%, -50%) scale(0.8) rotateY(15deg) rotateX(15deg); /* Start off-center, scaled, rotated */
            opacity: 0;
            pointer-events: none;
            filter: hue-rotate(0deg); /* Glitch filter */
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1),
                        opacity 0.6s ease,
                        filter 0.3s ease;
        }
        
        #modal-overlay.visible .login-container {
            transform: translate(-50%, -50%) scale(1) rotateY(0deg) rotateX(0deg); /* Fully visible, centered */
            opacity: 1;
            pointer-events: all;
        }
        
        /* Glitch effect on open/close */
        #modal-overlay.visible .login-container.glitching {
            filter: hue-rotate(180deg) blur(5px);
            transform: translate(-50%, -50%) scale(0.98) rotateY(5deg) rotateX(-5deg);
        }

        /* Holographic Frame for the Card */
        .login-card {
            position: relative;
            background: var(--card-bg-dark); /* Darker interior */
            backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--border-color-light);
            border-radius: 20px; /* More rounded */
            padding: 40px;
            box-sizing: border-box;
            box-shadow: 0 15px 60px rgba(0, 0, 0, 0.5); /* Deeper shadow */
            transform: rotateY(0deg) rotateX(0deg);
            transition: transform 0.1s linear, box-shadow 0.3s ease;
            
            /* Inner glowing border effect */
            &::before {
                content: '';
                position: absolute;
                inset: -2px; /* Slightly outside the border */
                border-radius: 22px;
                background: linear-gradient(45deg, var(--primary-glow), var(--secondary-glow));
                z-index: -1;
                filter: blur(25px); /* Soft glow */
                opacity: 0.3;
                animation: pulse-glow 3s infinite alternate;
            }
        }
        
        @keyframes pulse-glow {
            0% { opacity: 0.2; transform: scale(1); }
            100% { opacity: 0.4; transform: scale(1.01); }
        }


        /* --- Close Modal Button --- */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 35px;
            height: 35px;
            background: rgba(255,255,255,0.15);
            border: none;
            border-radius: 50%;
            color: var(--text-color);
            cursor: pointer;
            font-size: 1.5rem; /* Larger 'x' */
            line-height: 35px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }
        .close-btn:hover {
            background: var(--secondary-glow);
            color: var(--background-dark);
            transform: rotate(180deg) scale(1.1); /* Full spin */
            box-shadow: 0 0 25px var(--secondary-glow);
        }

        /* --- Login Title --- */
        .login-card h2 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            margin-bottom: 35px;
            font-weight: 700;
            text-align: center;
            color: var(--primary-glow);
            text-shadow: 0 0 15px rgba(0, 230, 255, 0.5);
        }

        /* --- Sliding Toggle --- */
        .login-toggle {
            position: relative;
            display: flex;
            margin-bottom: 40px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 35px;
            padding: 6px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.6);
        }
        .slider {
            position: absolute;
            top: 6px;
            left: 6px;
            width: calc(50% - 6px);
            height: calc(100% - 12px);
            background: linear-gradient(45deg, var(--primary-glow), var(--secondary-glow));
            border-radius: 30px;
            box-shadow: 0 0 20px var(--secondary-glow);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .toggle-btn {
            flex: 1; padding: 12px; background: transparent; border: none;
            color: var(--secondary-text); font-family: var(--font-heading);
            font-weight: 600; font-size: 1rem; cursor: pointer;
            transition: color 0.3s ease; outline: none; z-index: 2;
            text-shadow: 0 0 8px rgba(0,0,0,0.3);
        }
        .toggle-btn.active { color: white; text-shadow: none; }
        .login-toggle.admin-active .slider { transform: translateX(100%); }

        /* --- Animated Input Fields with Placeholder Typing --- */
        .input-group { position: relative; margin-bottom: 40px; }
        .input-group svg {
            position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
            width: 24px; height: 24px;
            color: var(--secondary-text); transition: color 0.3s ease;
        }
        .input-field {
            width: 100%; padding: 15px 15px 15px 50px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
            color: var(--text-color); font-size: 1.1rem;
            font-family: var(--font-body); box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .input-field::placeholder { color: transparent; /* Hide native placeholder */ }
        .input-field:focus { outline: none; border-color: var(--primary-glow); box-shadow: 0 0 20px rgba(0, 230, 255, 0.4); background: rgba(255,255,255,0.1); }
        .input-field:focus + svg { color: var(--primary-glow); }

        /* Custom placeholder (above input) */
        .custom-placeholder {
            position: absolute;
            left: 50px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary-text);
            font-size: 1.1rem;
            pointer-events: none;
            transition: all 0.3s ease;
            white-space: nowrap;
            overflow: hidden;
            border-right: 0.15em solid transparent; /* Blinking cursor */
            font-family: var(--font-mono);
            letter-spacing: 1px;
        }
        .input-field:focus ~ .custom-placeholder,
        .input-field:not(:placeholder-shown) ~ .custom-placeholder {
            opacity: 0; /* Hide custom placeholder when typing or focused */
        }
        /* Typing animation for placeholder */
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }
        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: var(--primary-glow); }
        }

        /* --- Error Message Display --- */
        #error-message {
            color: var(--error-glow);
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid var(--error-glow);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-family: var(--font-mono);
            display: none; /* Hidden by default */
        }

        /* --- "Aurora Wave" Button --- */
        .btn {
            width: 100%; padding: 18px; margin-top: 15px; border: none;
            border-radius: 10px; color: white; font-size: 1.3rem;
            font-weight: 700; font-family: var(--font-display);
            cursor: pointer; text-shadow: 0 0 8px rgba(0,0,0,0.5);
            letter-spacing: 1.5px; position: relative; overflow: hidden;
            
            background-size: 300% 300%;
            background-image: linear-gradient(45deg,
                var(--tertiary-glow),
                var(--primary-glow),
                var(--secondary-glow),
                var(--tertiary-glow)
            );
            animation: button-aurora 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        .btn:hover {
            box-shadow: 0 0 40px var(--primary-glow);
            transform: translateY(-3px) scale(1.02);
            animation-play-state: paused;
            filter: brightness(1.2);
        }
        .btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        @keyframes button-aurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* --- Submission Animation Container --- */
        #animation-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 258px; /* Maintain height */
            transition: opacity 0.3s ease;
            transform: translateZ(10px);
        }
        /* You can replace this with a more advanced loader if needed */
        #animation-container .loader {
            border: 5px solid rgba(0, 230, 255, 0.2);
            border-top: 5px solid var(--primary-glow);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        #animation-container .status-text {
             font-family: var(--font-display);
             font-size: 1.5rem;
             letter-spacing: 1px;
             color: var(--primary-glow);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader"></div>
        <p>ORBITAL OS BOOTING...</p>
    </div>

    <div id="wallpaper"></div>

    <div id="dock-container">
        <div class="dock-icon" id="login-icon" data-label="Login Portal">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
            </svg>
            <span>Login</span>
        </div>
        <div class="dock-icon" id="status-icon" data-label="System Status">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
            </svg>
            <span>Status</span>
        </div>
        <div class="dock-icon" id="help-icon" data-label="Help & Docs">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z" />
            </svg>
            <span>Help</span>
        </div>
        <div class="dock-icon" id="shutdown-icon" data-label="Shutdown">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5.636 5.636a9 9 0 1012.728 0M12 2v10" />
            </svg>
            <span>Power Off</span>
        </div>
    </div>

    <div id="modal-overlay">
        <div class="login-container" id="login-modal-container">
            <div class="login-card" id="login-card">
                
                <button class="close-btn" id="close-modal" title="Close">&times;</button>
                
                <h2 id="login-title">Student Login</h2>

                <div class="login-toggle" id="login-toggle">
                    <div class="slider"></div>
                    <button class="toggle-btn active" id="student-toggle">Student</button>
                    <button class="toggle-btn" id="admin-toggle">Admin</button>
                </div>
                
                <div id="error-message"></div>

                <form id="login-form" action="{{ url_for('handle_login') }}" method="POST">
                    <input type="hidden" name="login_type" id="login_type" value="student">
                    <div class="input-group">
                        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                        </svg>
                        <input type="text" name="username" class="input-field" placeholder="&nbsp;" required>
                        <span class="custom-placeholder" data-placeholder-text="Enter User ID or Email"></span>
                    </div>
                    
                    <div class="input-group">
                        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                        </svg>
                        <input type="password" name="password" class="input-field" placeholder="&nbsp;" required>
                        <span class="custom-placeholder" data-placeholder-text="Enter Secure Passcode"></span>
                    </div>
                    
                    <button type="submit" class="btn">Login to System</button>
                </form>

                <div id="animation-container">
                    <div class="loader"></div>
                    <div class="status-text">AUTHENTICATING...</div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- Optional: Play sound effects ---
        function playSound(soundId) {
            // const audio = document.getElementById(soundId);
            // if (audio) { audio.currentTime = 0; audio.play(); } // Reset and play
            console.log(`Playing sound: ${soundId}`);
        }

        // --- Loading Screen ---
        window.addEventListener('load', () => {
            const loadingScreen = document.getElementById('loading-screen');
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
                playSound('boot-complete-audio');
            }, 1500); // Shorter load time
        });

        /**
         * Animation 1: 3D Parallax
         */
        const modalContainer = document.getElementById('login-modal-container');
        const modalCard = document.getElementById('login-card');
        const dockContainer = document.getElementById('dock-container');
        const maxDockRotate = 5;
        const maxModalRotate = 10;

        function applyParallax(container, card, e, maxRot) {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            const rotateY = (x / (rect.width / 2)) * maxRot;
            const rotateX = -(y / (rect.height / 2)) * maxRot;
            card.style.transform = `rotateY(${rotateY}deg) rotateX(${rotateX}deg) scale(1.02) translateZ(0)`;
        }
        
        function resetParallax(card) {
             card.style.transform = `rotateY(0deg) rotateX(0deg) scale(1) translateZ(0)`;
        }
        
        modalContainer.addEventListener('mousemove', (e) => {
            if (modalOverlay.classList.contains('visible')) {
                applyParallax(modalContainer, modalCard, e, maxModalRotate);
            }
        });
        modalContainer.addEventListener('mouseleave', () => {
            resetParallax(modalCard);
        });
        
        dockContainer.addEventListener('mousemove', (e) => {
            applyParallax(dockContainer, dockContainer, e, maxDockRotate);
        });
        dockContainer.addEventListener('mouseleave', () => {
            resetParallax(dockContainer);
        });

        /**
         * Functionality 2: Modal Open/Close with Glitch Effect
         */
        const loginIcon = document.getElementById('login-icon');
        const modalOverlay = document.getElementById('modal-overlay');
        const closeModalBtn = document.getElementById('close-modal');

        function openModal() {
            playSound('app-open-audio');
            modalOverlay.classList.add('visible');
            modalContainer.classList.add('glitching');
            setTimeout(() => {
                modalContainer.classList.remove('glitching');
            }, 300);
        }

        function closeModal() {
            playSound('app-close-audio');
            modalContainer.classList.add('glitching');
             setTimeout(() => {
                modalOverlay.classList.remove('visible');
                modalContainer.classList.remove('glitching');
                // Reset form fields and toggle
                document.getElementById('login-form').reset();
                setToggleState(true); // Reset to student view
                document.getElementById('error-message').style.display = 'none'; // Hide errors
            }, 300);
        }

        loginIcon.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        /**
         * Functionality 3: Admin/Student Toggle
         */
        const studentToggle = document.getElementById('student-toggle');
        const adminToggle = document.getElementById('admin-toggle');
        const loginToggle = document.getElementById('login-toggle');
        const loginTitle = document.getElementById('login-title');
        const loginTypeInput = document.getElementById('login_type');
        const usernamePlaceholder = document.querySelector('.input-group:nth-child(1) .custom-placeholder');
        const passwordPlaceholder = document.querySelector('.input-group:nth-child(2) .custom-placeholder');

        function setToggleState(isStudent) {
            // Stop any existing placeholder animations
            clearTimeout(window.placeholderTimeout1);
            clearTimeout(window.placeholderTimeout2);

            if (isStudent) {
                loginToggle.classList.remove('admin-active');
                studentToggle.classList.add('active');
                adminToggle.classList.remove('active');
                loginTitle.textContent = 'Student Login';
                loginTypeInput.value = 'student';
                usernamePlaceholder.dataset.placeholderText = 'Enter Student ID or Email';
            } else {
                loginToggle.classList.add('admin-active');
                adminToggle.classList.add('active');
                studentToggle.classList.remove('active');
                loginTitle.textContent = 'Admin Login';
                loginTypeInput.value = 'admin';
                usernamePlaceholder.dataset.placeholderText = 'Enter Admin Username';
            }
            // Retrigger placeholder animation for new text
            animatePlaceholder(usernamePlaceholder);
            animatePlaceholder(passwordPlaceholder); // Always animate password placeholder
        }

        studentToggle.addEventListener('click', () => setToggleState(true));
        adminToggle.addEventListener('click', () => setToggleState(false));
        
        // Initial state
        setToggleState(true);

        /**
         * Functionality 4: Animated Custom Placeholders
         */
        function animatePlaceholder(placeholder) {
            const text = placeholder.dataset.placeholderText;
            let i = 0;
            placeholder.textContent = '';
            placeholder.style.animation = 'none';
            void placeholder.offsetWidth; // Trigger reflow

            function typeChar() {
                if (i < text.length) {
                    placeholder.textContent += text.charAt(i);
                    i++;
                    window[`placeholderTimeout${placeholder === usernamePlaceholder ? 1 : 2}`] = setTimeout(typeChar, 70);
                } else {
                    placeholder.style.animation = 'blink-caret 1s steps(1) infinite';
                }
            }
             window[`placeholderTimeout${placeholder === usernamePlaceholder ? 1 : 2}`] = setTimeout(typeChar, 100); // Start typing after a short delay
        }

        document.querySelectorAll('.input-field').forEach(input => {
            const placeholder = input.nextElementSibling; // The custom placeholder span
            
            input.addEventListener('focus', () => {
                placeholder.style.opacity = '0';
                 clearTimeout(window.placeholderTimeout1); // Stop animations on focus
                 clearTimeout(window.placeholderTimeout2);
            });
            input.addEventListener('blur', () => {
                if (!input.value) {
                    placeholder.style.opacity = '1';
                    animatePlaceholder(placeholder);
                }
            });
            input.addEventListener('input', () => {
                 if (input.value) placeholder.style.opacity = '0';
                 else placeholder.style.opacity = '1'; // Show placeholder if field becomes empty
            });
        });

        /**
         * Functionality 5: Handle Login Submission and Display Errors
         */
        const form = document.getElementById('login-form');
        const formContent = document.getElementById('login-form-content');
        const animContainer = document.getElementById('animation-container');
        const errorMessageDiv = document.getElementById('error-message');

        form.addEventListener('submit', (e) => {
            e.preventDefault(); // Prevent default submission initially
            playSound('submit-start-audio');

            // Hide form, show animation
            errorMessageDiv.style.display = 'none'; // Hide previous errors
            formContent.style.display = 'none';
            animContainer.style.display = 'flex';

            // Simulate server interaction time (or use actual fetch)
            setTimeout(() => {
                // ---> SUBMIT THE FORM <---
                form.submit(); // Submit the form to the Flask backend
                
                // Note: The JS animation stops here. Flask will handle the response.
                // If login fails, Flask will re-render this page, possibly with an error.
                // If login succeeds, Flask will redirect to the dashboard.
                // For demo purposes, we'll reset the form after another delay:
                /*
                setTimeout(() => {
                    animContainer.style.display = 'none';
                    formContent.style.display = 'block';
                    form.reset();
                    setToggleState(true); // Reset toggle
                }, 1000); // Reset after 1 second
                */

            }, 1500); // Show animation for 1.5 seconds before submitting
        });

        // Check if Flask sent back an error message
        const flaskError = "{{ error | default('') }}"; // Get error from Flask template context
        if (flaskError) {
            errorMessageDiv.textContent = flaskError;
            errorMessageDiv.style.display = 'block';
            openModal(); // Open modal automatically if there was a login error
        }

        // Dummy handlers for other dock icons
        document.getElementById('status-icon').addEventListener('click', () => {
             alert('System Status: All systems nominal. Network latency: 12ms. (Dummy)');
             playSound('alert-audio');
        });
        document.getElementById('help-icon').addEventListener('click', () => {
             alert('Help Files: Accessing secure documentation portal... (Dummy)');
             playSound('alert-audio');
        });
        document.getElementById('shutdown-icon').addEventListener('click', () => {
             if (confirm('Initiate system shutdown sequence?')) {
                 alert('Shutting down Orbital OS...');
                 playSound('shutdown-audio');
                 // Simulate shutdown - in reality, might redirect or close window
                 document.body.style.transition = 'opacity 1s ease';
                 document.body.style.opacity = '0';
                 setTimeout(() => window.location.reload(), 1100);
             }
        });
    </script>
</body>
</html>
